name: Python Application CI

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger button

jobs:
  build-and-test:
    name: Build, Test, and Run Python
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download code from repository
      - name: Check out the repository
        uses: actions/checkout@v4

      # Step 2: Set up official Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Automatically caches installed library downloads for speed

      # Step 3: Upgrade pip and install testing framework
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # Step 4: Run automated tests with pytest
      - name: Run Unit Tests
        run: pytest test_hello.py

      # Step 5: Execute the main script with environment variables
      - name: Run Python script
        env:
          WHO_TO_GREET: 'GitHub Actions Student'
        run: python hello.py
